<script>
    let workbookData = [];
    let headers = [];
    let originalData = [];

    const fileInput =
        document.getElementById("fileInput");

    const table =
        document.getElementById("excelTable");

    const searchInput =
        document.getElementById("searchInput");

    const rowCount =
        document.getElementById("rowCount");

    const colCount =
        document.getElementById("colCount");

    /* =====================
       UPLOAD EXCEL
    ===================== */

    fileInput.addEventListener(
        "change",
        handleFile
    );

    function handleFile(e) {

        const file =
            e.target.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload = function (evt) {

            const data =
                new Uint8Array(
                    evt.target.result
                );

            const workbook =
                XLSX.read(data, {
                    type: "array"
                });

            const sheetName =
                workbook.SheetNames[0];

            const sheet =
                workbook.Sheets[sheetName];

            workbookData =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval: ""
                    }
                );

            originalData =
                JSON.parse(
                    JSON.stringify(
                        workbookData
                    )
                );

            headers =
                Object.keys(
                    workbookData[0] || {}
                );

            updateStats();

            renderTable(
                workbookData
            );
        };

        reader.readAsArrayBuffer(
            file
        );
    }

    /* =====================
       TABLE RENDER
    ===================== */

    function renderTable(data) {

        table.innerHTML = "";

        if (!data.length) {

            table.innerHTML =
                `
        <tr>
            <td style="
                padding:30px;
                text-align:center;
            ">
                Không có dữ liệu
            </td>
        </tr>
        `;

            return;
        }

        const thead =
            document.createElement(
                "thead"
            );

        const headRow =
            document.createElement(
                "tr"
            );

        headers.forEach(header => {

            const th =
                document.createElement(
                    "th"
                );

            th.innerText =
                header;

            headRow.appendChild(
                th
            );
        });

        thead.appendChild(
            headRow
        );

        table.appendChild(
            thead
        );

        const tbody =
            document.createElement(
                "tbody"
            );

        data.forEach(row => {

            const tr =
                document.createElement(
                    "tr"
                );

            headers.forEach(header => {

                const td =
                    document.createElement(
                        "td"
                    );

                td.contentEditable =
                    true;

                td.innerText =
                    row[header];

                td.addEventListener(
                    "blur",
                    function () {

                        row[header] =
                            td.innerText;
                    }
                );

                tr.appendChild(
                    td
                );
            });

            tbody.appendChild(
                tr
            );
        });

        table.appendChild(
            tbody
        );
    }

    /* =====================
       FILTER
    ===================== */

    searchInput.addEventListener(
        "input",
        function () {

            const keyword =
                this.value
                    .toLowerCase()
                    .trim();

            if (!keyword) {

                renderTable(
                    workbookData
                );

                return;
            }

            const filtered =
                workbookData.filter(
                    row => {

                        return headers.some(
                            header => {

                                return String(
                                    row[header]
                                )
                                    .toLowerCase()
                                    .includes(
                                        keyword
                                    );
                            });
                    });

            renderTable(
                filtered
            );
        }
    );

    /* =====================
       RENAME COLUMN
    ===================== */

    function renameColumn() {

        if (!headers.length) {

            alert(
                "Upload file trước"
            );

            return;
        }

        const oldName =
            prompt(
                "Tên cột cũ:"
            );

        if (!oldName) {
            return;
        }

        const newName =
            prompt(
                "Tên cột mới:"
            );

        if (!newName) {
            return;
        }

        workbookData =
            workbookData.map(
                row => {

                    row[newName] =
                        row[oldName];

                    delete row[
                        oldName
                    ];

                    return row;
                });

        headers =
            headers.map(h =>

                h === oldName
                    ? newName
                    : h
            );

        renderTable(
            workbookData
        );
    }

    /* =====================
       DELETE COLUMN
    ===================== */

    function deleteColumn() {

        const column =
            prompt(
                "Tên cột muốn xoá:"
            );

        if (!column) {
            return;
        }

        workbookData.forEach(
            row => {

                delete row[
                    column
                ];
            });

        headers =
            headers.filter(
                h => h !== column
            );

        updateStats();

        renderTable(
            workbookData
        );
    }

    /* =====================
       SELECT COLUMN
    ===================== */

    function selectColumns() {

        const cols =
            prompt(
                "Nhập tên cột giữ lại (phân cách dấu phẩy)\nVí dụ: name,age,salary"
            );

        if (!cols) {
            return;
        }

        const selected =
            cols.split(",")
                .map(x =>
                    x.trim()
                );

        workbookData =
            workbookData.map(
                row => {

                    let obj = {};

                    selected.forEach(
                        col => {

                            obj[col] =
                                row[col];
                        });

                    return obj;
                });

        headers =
            selected;

        updateStats();

        renderTable(
            workbookData
        );
    }

    /* =====================
       FORMULA COLUMN
    ===================== */

    function addFormulaColumn() {

        const newColumn =
            prompt(
                "Tên cột mới:"
            );

        if (!newColumn) {
            return;
        }

        const col1 =
            prompt(
                "Tên cột số 1:"
            );

        const col2 =
            prompt(
                "Tên cột số 2:"
            );

        const operator =
            prompt(
                "Toán tử (+ - * /)"
            );

        workbookData.forEach(
            row => {

                const a =
                    Number(
                        row[col1]
                    ) || 0;

                const b =
                    Number(
                        row[col2]
                    ) || 0;

                switch (operator) {

                    case "+":
                        row[
                            newColumn
                        ] = a + b;
                        break;

                    case "-":
                        row[
                            newColumn
                        ] = a - b;
                        break;

                    case "*":
                        row[
                            newColumn
                        ] = a * b;
                        break;

                    case "/":
                        row[
                            newColumn
                        ] =
                            b !== 0
                                ? a / b
                                : 0;
                        break;
                }
            });

        headers.push(
            newColumn
        );

        updateStats();

        renderTable(
            workbookData
        );
    }

    /* =====================
       SORT
    ===================== */

    function sortData() {

        const col =
            prompt(
                "Tên cột muốn sort:"
            );

        if (!col) {
            return;
        }

        const type =
            prompt(
                "ASC hoặc DESC"
            );

        workbookData.sort(
            (a, b) => {

                if (type
                    .toUpperCase()
                    === "DESC") {

                    return b[col]
                        > a[col]
                        ? 1 : -1;
                }

                return a[col]
                    > b[col]
                    ? 1 : -1;
            });

        renderTable(
            workbookData
        );
    }

    /* =====================
       EXPORT EXCEL
    ===================== */

    function exportExcel() {

        const ws =
            XLSX.utils
                .json_to_sheet(
                    workbookData
                );

        const wb =
            XLSX.utils
                .book_new();

        XLSX.utils
            .book_append_sheet(
                wb,
                ws,
                "Processed"
            );

        XLSX.writeFile(
            wb,
            "processed.xlsx"
        );
    }

    /* =====================
       CLEAR DATA
    ===================== */

    function clearData() {

        const confirmClear =
            confirm(
                "Xoá toàn bộ dữ liệu?"
            );

        if (!confirmClear) {
            return;
        }

        workbookData = [];
        headers = [];

        table.innerHTML =
            "";

        searchInput.value =
            "";

        updateStats();
    }

    /* =====================
       UPDATE STATS
    ===================== */

    function updateStats() {

        rowCount.innerText =
            workbookData.length;

        colCount.innerText =
            headers.length;
    }


</script>
